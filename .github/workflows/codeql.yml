name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 16 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: rust
            build-mode: none
          - language: actions
            build-mode: default

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - name: Accept Android SDK licenses
        if: matrix.language == 'java-kotlin'
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDK_MANAGER" ]; then
            SDK_MANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          fi
          if [ -f "$SDK_MANAGER" ]; then
            echo "Accepting Android SDK licenses via $SDK_MANAGER"
            yes | "$SDK_MANAGER" --licenses 2>&1 || true
            "$SDK_MANAGER" --install "ndk;30.0.15729638" 2>&1 || true
          else
            echo "sdkmanager not found at $ANDROID_HOME; trying PATH"
            yes | sdkmanager --licenses 2>&1 || true
            sdkmanager --install "ndk;30.0.15729638" 2>&1 || true
          fi

      - name: Set up Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      # - name: Set up Android native toolchain
      #   if: matrix.language == 'java-kotlin'
      #   uses: ./.github/actions/setup-android-native-toolchain

      - name: Initialize CodeQL for compiled code
        if: matrix.build-mode == 'manual'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Initialize CodeQL without build
        if: matrix.build-mode == 'none'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Initialize CodeQL
        if: matrix.build-mode == 'default'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Build Android app for CodeQL
        if: matrix.language == 'java-kotlin'
        run: gradle assembleDebug --no-daemon --warning-mode all

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
